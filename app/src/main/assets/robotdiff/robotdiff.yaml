#参数列表
#availableModeList
# 0-送餐，1-送小吃，2-直达，3-祝福歌，4-多点，5-迎宾，7-回盘

#availableThemeList
# 0-深色（默认），1-红色，2-金色，3-浅色

#viceScreen
#T5 Pro上的表情灯板

#adScreen
#T8Pro T10的广告屏

#autoAddLayer
#T8Pro T8 补录桌号

#chargeTip
#T8Pro T8 T10补录桌号

#doorLampSet
#T3 舱门设置

#welcomeGuideSet
#T8 T8Pro T10 T10S 移动迎宾


